<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: scp-cache:; connect-src 'self' https: http:;" />
  <title>SCP Archive</title>
  <link rel="stylesheet" href="./styles/app.css" />
  <link rel="stylesheet" href="./styles/reader.css" />
</head>
<body>
  <!-- Instant Boot Splash (renders immediately on frame 0 with SCP Foundation emblem + progress) -->
  <div id="boot-splash" class="boot-splash" aria-live="polite">
    <div class="boot-card">
      <svg class="boot-emblem" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle class="boot-ring-spin" cx="60" cy="60" r="48" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.55" />
        <g id="boot-triad">
          <path d="M23.5 39 A42 42 0 0 1 46 20.5 L48 10 H72 L74 20.5 A42 42 0 0 1 96.5 39" stroke="currentColor" stroke-width="4.5" stroke-linecap="square" />
          <path d="M56.5 22 H63.5 V35 H70 L60 47 L50 35 H56.5 Z" fill="currentColor" />
        </g>
        <use href="#boot-triad" transform="rotate(120 60 60)" />
        <use href="#boot-triad" transform="rotate(240 60 60)" />
        <circle cx="60" cy="60" r="14.5" stroke="#e04c58" stroke-width="4" />
      </svg>
      <div class="boot-title">SCP ARCHIVE</div>
      <div class="boot-motto">SECURE · CONTAIN · PROTECT</div>
      <div class="boot-bar-track"><div id="boot-progress-bar" class="boot-bar-fill" style="width:18%"></div></div>
      <div class="boot-meta">
        <span id="boot-progress-text">正在初始化基金会档案终端...</span>
        <span id="boot-progress-pct">18%</span>
      </div>
    </div>
  </div>

  <div id="app-shell">
    <!-- Titlebar + Multi-Tab Bar -->
    <header id="titlebar">
      <div class="brand-area" title="SCP Archive">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 2.5v4M4.2 16.5l3.5-2M19.8 16.5l-3.5-2" />
        </svg>
        <span class="brand-title" data-i18n="app.name">SCP ARCHIVE</span>
      </div>

      <div id="tab-strip" class="tab-strip" role="tablist"></div>

      <button id="btn-new-tab" class="icon-btn tab-add-btn" data-i18n-title="titlebar.newTab">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 3v10M3 8h10" />
        </svg>
      </button>
      <div class="titlebar-drag-spacer"></div>
      <div class="window-controls-spacer"></div>
    </header>

    <!-- Primary Toolbar -->
    <div id="toolbar">
      <div class="toolbar-left">
        <button id="btn-toggle-sidebar" class="icon-btn" data-i18n-title="toolbar.toggleSidebar">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2" />
            <path d="M7.5 3.5v13" />
          </svg>
        </button>
        <button id="btn-nav-back" class="icon-btn" data-i18n-title="toolbar.back" disabled>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12.5 5l-5 5 5 5" />
          </svg>
        </button>
        <button id="btn-nav-forward" class="icon-btn" data-i18n-title="toolbar.forward" disabled>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M7.5 5l5 5-5 5" />
          </svg>
        </button>
        <button id="btn-nav-reload" class="icon-btn" data-i18n-title="toolbar.reload">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M15.8 10a5.8 5.8 0 1 1-1.5-3.9M15.8 4.2v3.2h-3.2" />
          </svg>
        </button>

        <div id="branch-switcher" class="branch-switcher" data-i18n-title="toolbar.branchSwitchTitle"></div>
      </div>

      <div class="toolbar-center">
        <div class="omnibox">
          <svg class="omnibox-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="9" cy="9" r="5.5" />
            <path d="M13.5 13.5L17 17" />
          </svg>
          <input id="omnibox-input" type="text" data-i18n-placeholder="toolbar.omniboxPlaceholder" autocomplete="off" />
          <button id="btn-omnibox-go" class="omnibox-go" data-i18n="toolbar.omniboxGo">前往</button>
        </div>

        <div class="random-split">
          <button id="btn-random-scp" class="tool-pill" data-i18n-title="toolbar.randomTitle">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="3" width="14" height="14" rx="2.5" />
              <circle cx="7" cy="7" r="1" fill="currentColor" />
              <circle cx="13" cy="7" r="1" fill="currentColor" />
              <circle cx="10" cy="10" r="1" fill="currentColor" />
              <circle cx="7" cy="13" r="1" fill="currentColor" />
              <circle cx="13" cy="13" r="1" fill="currentColor" />
            </svg>
            <span data-i18n="toolbar.random">随机</span>
          </button>
          <button id="btn-random-menu" class="tool-pill-caret" data-i18n-title="toolbar.randomMenuTitle">▾</button>
        </div>
      </div>

      <div class="toolbar-right">
        <button id="btn-cross-branch" class="tool-btn hidden" data-i18n-title="toolbar.crossBranchTitle">
          <span id="cross-branch-label">⇄ EN</span>
        </button>

        <div id="mode-toggle-group" class="segmented-mini hidden" data-i18n-title="toolbar.modeToggleTitle">
          <button id="btn-mode-clean" class="seg-btn active" data-mode="clean" data-i18n="toolbar.modeClean">纯净</button>
          <button id="btn-mode-original" class="seg-btn" data-mode="original" data-i18n="toolbar.modeOriginal">原版</button>
        </div>

        <button id="btn-toggle-collapsibles" class="icon-btn hidden" data-i18n-title="toolbar.toggleCollapsibles">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M5 7l5-3.5L15 7M5 13l5 3.5L15 13" />
          </svg>
        </button>

        <button id="btn-bookmark" class="icon-btn hidden" data-i18n-title="toolbar.bookmark">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M5 3.5h10a1 1 0 0 1 1 1v12.5l-6-3.8-6 3.8V4.5a1 1 0 0 1 1-1z" />
          </svg>
        </button>

        <button id="btn-cache-doc" class="icon-btn hidden" data-i18n-title="toolbar.cacheDoc">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M10 3v9.5M6.5 9.5L10 13l3.5-3.5M4 15.5h12" />
          </svg>
        </button>

        <button id="btn-export-menu" class="icon-btn hidden" data-i18n-title="toolbar.exportMenu">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M10 12.5V3M6.5 6.5L10 3l3.5 3.5M4 13v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3" />
          </svg>
        </button>

        <div id="font-size-group" class="font-size-group hidden">
          <button id="btn-tb-font-dec" class="font-step-btn" data-i18n-title="toolbar.fontDec">A-</button>
          <button id="btn-tb-font-reset" class="font-val-btn" data-i18n-title="toolbar.fontReset">16</button>
          <button id="btn-tb-font-inc" class="font-step-btn" data-i18n-title="toolbar.fontInc">A+</button>
        </div>

        <button id="btn-appearance-menu" class="tool-btn" data-i18n-title="toolbar.appearance">Aa</button>

        <button id="btn-account-menu" class="account-btn" data-i18n-title="toolbar.account">
          <span class="account-dot"></span>
          <span id="account-btn-label" data-i18n="toolbar.accountLogin">登录</span>
        </button>

        <button id="btn-open-settings" class="icon-btn" data-i18n-title="toolbar.settings">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="10" cy="10" r="2.7" />
            <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Workspace -->
    <div id="workspace">
      <aside id="sidebar">
        <nav class="activity-rail">
          <button class="rail-btn active" data-panel="catalog">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M3.5 5h13M3.5 10h13M3.5 15h9" />
            </svg>
            <span data-i18n="rail.catalog">目录</span>
          </button>
          <button class="rail-btn" data-panel="search">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="8.8" cy="8.8" r="5" />
              <path d="M12.8 12.8L16.8 16.8" />
            </svg>
            <span data-i18n="rail.search">搜索</span>
          </button>
          <button class="rail-btn" data-panel="bookmarks">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M5 3.5h10a1 1 0 0 1 1 1v12.5l-6-3.8-6 3.8V4.5a1 1 0 0 1 1-1z" />
            </svg>
            <span data-i18n="rail.bookmarks">收藏</span>
          </button>
          <button class="rail-btn" data-panel="history">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="10" cy="10" r="6.8" />
              <path d="M10 6.2V10l2.8 1.8" />
            </svg>
            <span data-i18n="rail.history">历史</span>
          </button>
          <button class="rail-btn" data-panel="offline">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M4 13.5v2a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-2" />
              <path d="M10 3v8.5M6.8 8.5L10 11.7l3.2-3.2" />
            </svg>
            <span data-i18n="rail.offline">离线</span>
          </button>
        </nav>

        <div id="sidebar-panel" class="sidebar-panel">
          <!-- Catalog -->
          <section id="panel-catalog" class="panel-view active">
            <div class="panel-header">
              <span class="panel-title" data-i18n="sidebar.catalogTitle">系列目录</span>
              <button id="btn-refresh-series" class="mini-btn" data-i18n="sidebar.refresh" data-i18n-title="sidebar.refreshSeriesTitle">刷新</button>
            </div>
            <div class="panel-controls">
              <select id="series-select" class="select-input"></select>
              <input id="series-filter" class="text-input" type="text" data-i18n-placeholder="sidebar.filterSeriesPlaceholder" />
            </div>
            <div id="series-status" class="panel-subinfo"></div>
            <div id="series-list" class="item-list"></div>
          </section>

          <!-- Search -->
          <section id="panel-search" class="panel-view">
            <div class="panel-header">
              <span class="panel-title" data-i18n="sidebar.searchTitle">搜索与标签</span>
              <select id="search-scope" class="mini-select">
                <option value="online" data-i18n="sidebar.scopeOnline">全站在线</option>
                <option value="offline" data-i18n="sidebar.scopeOffline">仅离线库</option>
              </select>
            </div>
            <div class="panel-controls">
              <div class="inline-search">
                <input id="sidebar-search-input" class="text-input" type="text" data-i18n-placeholder="sidebar.searchPlaceholder" />
                <button id="btn-sidebar-search" class="accent-btn" data-i18n="sidebar.searchBtn">搜索</button>
              </div>
              <div id="quick-tags" class="tag-chips"></div>
            </div>
            <div id="search-status" class="panel-subinfo"></div>
            <div id="search-results" class="item-list"></div>
          </section>

          <!-- Bookmarks -->
          <section id="panel-bookmarks" class="panel-view">
            <div class="panel-header">
              <span class="panel-title" data-i18n="sidebar.bookmarksTitle">收藏夹</span>
              <span id="bookmarks-count" class="badge-muted">0</span>
            </div>
            <div class="panel-controls">
              <select id="bookmark-folder-filter" class="select-input">
                <option value="__ALL__" data-i18n="sidebar.allFolders">全部分组</option>
              </select>
              <input id="bookmark-filter" class="text-input" type="text" data-i18n-placeholder="sidebar.filterBookmarksPlaceholder" />
            </div>
            <div id="bookmarks-list" class="item-list"></div>
          </section>

          <!-- History -->
          <section id="panel-history" class="panel-view">
            <div class="panel-header">
              <span class="panel-title" data-i18n="sidebar.historyTitle">阅读历史</span>
              <button id="btn-clear-history" class="mini-btn danger-text" data-i18n="sidebar.clear">清空</button>
            </div>
            <div class="panel-controls">
              <input id="history-filter" class="text-input" type="text" data-i18n-placeholder="sidebar.filterHistoryPlaceholder" />
            </div>
            <div id="history-list" class="item-list"></div>
          </section>

          <!-- Offline Cache -->
          <section id="panel-offline" class="panel-view">
            <div class="panel-header">
              <span class="panel-title" data-i18n="sidebar.offlineTitle">离线缓存库</span>
              <div class="panel-header-actions">
                <button id="btn-toggle-batch" class="mini-btn" data-i18n="batch.toggleBtn">分批下载</button>
                <button id="btn-clear-cache" class="mini-btn danger-text" data-i18n="sidebar.clear">清空</button>
              </div>
            </div>
            <div id="cache-stats-bar" class="panel-subinfo"></div>

            <!-- Chunked Batch Offline Downloader -->
            <div id="batch-panel" class="batch-panel hidden">
              <div class="batch-title" data-i18n="batch.title">按系列分批次离线下载</div>
              <select id="batch-series-select" class="select-input"></select>
              <div class="batch-grid">
                <select id="batch-size-select" class="select-input" data-i18n-title="batch.chunkSizeTitle">
                  <option value="20" data-i18n="batch.size20">每批 20 篇</option>
                  <option value="50" selected data-i18n="batch.size50">每批 50 篇</option>
                  <option value="100" data-i18n="batch.size100">每批 100 篇</option>
                  <option value="200" data-i18n="batch.size200">每批 200 篇</option>
                </select>
                <select id="batch-chunk-select" class="select-input"></select>
              </div>
              <div class="batch-checks">
                <label class="batch-chk"><input id="batch-skip-cached" type="checkbox" checked /> <span data-i18n="batch.skipCached">跳过已缓存</span></label>
                <label class="batch-chk"><input id="batch-with-images" type="checkbox" /> <span data-i18n="batch.withImages">含图片</span></label>
              </div>
              <div class="batch-actions">
                <button id="btn-batch-start" class="accent-btn full-width" data-i18n="batch.startBtn">开始下载本批</button>
                <button id="btn-batch-cancel" class="secondary-btn danger-text full-width hidden" data-i18n="batch.cancelBtn">停止下载</button>
              </div>
              <div id="batch-progress-box" class="batch-progress hidden">
                <div id="batch-progress-text" class="batch-progress-text"></div>
                <div class="progress-mini"><div id="batch-progress-bar" class="progress-mini-fill" style="width:0%"></div></div>
                <div id="batch-progress-stats" class="batch-progress-stats"></div>
              </div>
            </div>

            <div class="panel-controls">
              <input id="offline-filter" class="text-input" type="text" data-i18n-placeholder="sidebar.filterOfflinePlaceholder" />
            </div>
            <div id="offline-list" class="item-list"></div>
          </section>
        </div>
      </aside>

      <div id="sidebar-resizer" class="sidebar-resizer"></div>

      <main id="stage">
        <div id="find-bar" class="find-bar hidden">
          <input id="find-input" type="text" data-i18n-placeholder="find.placeholder" autocomplete="off" />
          <span id="find-count" class="find-count">0/0</span>
          <button id="btn-find-prev" class="mini-btn" data-i18n-title="find.prev">↑</button>
          <button id="btn-find-next" class="mini-btn" data-i18n-title="find.next">↓</button>
          <button id="btn-find-close" class="mini-btn" data-i18n-title="find.close">✕</button>
        </div>
        <div id="tab-views"></div>
      </main>
    </div>
  </div>

  <!-- Popover: Random -->
  <div id="popover-random" class="popover hidden">
    <div class="popover-title" data-i18n="randomMenu.title">选择随机范围</div>
    <button class="popover-item" data-random="scp" data-i18n="randomMenu.scp">随机主站 / 翻译 SCP</button>
    <button class="popover-item" data-random="cn-original" data-i18n="randomMenu.cnOriginal">随机中文分部原创 SCP</button>
    <button class="popover-item" data-random="tale" data-i18n="randomMenu.tale">随机外围故事 (Tale)</button>
    <div class="popover-divider"></div>
    <button class="popover-item" data-random="safe" data-i18n="randomMenu.safe">随机 Safe 级 SCP</button>
    <button class="popover-item" data-random="euclid" data-i18n="randomMenu.euclid">随机 Euclid 级 SCP</button>
    <button class="popover-item" data-random="keter" data-i18n="randomMenu.keter">随机 Keter 级 SCP</button>
    <button class="popover-item" data-random="thaumiel" data-i18n="randomMenu.thaumiel">随机 Thaumiel 级 SCP</button>
    <button class="popover-item" data-random="joke" data-i18n="randomMenu.joke">随机搞笑 SCP (-J)</button>
  </div>

  <!-- Popover: Export -->
  <div id="popover-export" class="popover hidden">
    <div class="popover-title" data-i18n="exportMenu.title">导出与外部操作</div>
    <button class="popover-item" data-export="markdown" data-i18n="exportMenu.markdown">导出为 Markdown (.md)</button>
    <button class="popover-item" data-export="html" data-i18n="exportMenu.html">导出为单文件 HTML (.html)</button>
    <div class="popover-divider"></div>
    <button class="popover-item" data-export="open-browser" data-i18n="exportMenu.openBrowser">在系统默认浏览器中打开原文</button>
    <button class="popover-item" data-export="copy-url" data-i18n="exportMenu.copyUrl">复制原文链接</button>
  </div>

  <!-- Popover: Wikidot Account -->
  <div id="popover-account" class="popover popover-wide hidden">
    <div class="popover-title" data-i18n="accountMenu.title">Wikidot 统一账号</div>
    <div id="account-status-card" class="account-status-card">
      <div id="account-status-text" class="account-status-main" data-i18n="accountMenu.signedOut">当前未登录</div>
      <div class="account-status-sub" data-i18n="accountMenu.sharedNote">主站 (EN)、中文分部 (CN) 及其他分部共用同一 Wikidot 账号与登录态。</div>
    </div>
    <div class="account-tip" data-i18n="accountMenu.voteTip">登录后在「原版」模式下可直接进行评分、参与讨论或查看受限页面。</div>
    <div id="account-actions-signed-out" class="popover-stack">
      <button id="btn-do-login" class="accent-btn full-width" data-i18n="accountMenu.loginBtn">登录 Wikidot 账号</button>
      <button id="btn-refresh-auth" class="secondary-btn full-width" data-i18n="accountMenu.refreshStatus">刷新登录状态</button>
    </div>
    <div id="account-actions-signed-in" class="popover-stack hidden">
      <button id="btn-open-profile" class="secondary-btn full-width" data-i18n="accountMenu.openProfile">查看 Wikidot 个人主页</button>
      <button id="btn-refresh-auth-in" class="secondary-btn full-width" data-i18n="accountMenu.refreshStatus">刷新登录状态</button>
      <button id="btn-do-logout" class="mini-btn danger-text full-width" data-i18n="accountMenu.logoutBtn">退出登录</button>
    </div>
  </div>

  <!-- Popover: Appearance -->
  <div id="popover-appearance" class="popover popover-wide hidden">
    <div class="popover-title" data-i18n="appearance.title">阅读外观与排版</div>
    <div class="pref-row">
      <label data-i18n="appearance.theme">阅读主题</label>
      <div class="theme-pills">
        <button class="theme-pill" data-theme="light" data-i18n="appearance.themeLight">明亮</button>
        <button class="theme-pill" data-theme="sepia" data-i18n="appearance.themeSepia">护眼纸色</button>
        <button class="theme-pill" data-theme="dark" data-i18n="appearance.themeDark">暗黑</button>
      </div>
    </div>
    <div class="pref-row">
      <label><span data-i18n="appearance.fontSize">字号</span> <span id="val-font-size">16px</span></label>
      <div class="stepper">
        <button id="btn-font-dec" class="mini-btn">A-</button>
        <input id="range-font-size" type="range" min="12" max="30" step="1" value="16" />
        <button id="btn-font-inc" class="mini-btn">A+</button>
      </div>
    </div>
    <div class="pref-row">
      <label><span data-i18n="appearance.lineHeight">行距</span> <span id="val-line-height">1.75</span></label>
      <input id="range-line-height" type="range" min="1.4" max="2.2" step="0.05" value="1.75" />
    </div>
    <div class="pref-row">
      <label data-i18n="appearance.contentWidth">正文版宽</label>
      <div class="width-pills">
        <button class="width-pill" data-width="680" data-i18n="appearance.widthNarrow">窄</button>
        <button class="width-pill" data-width="820" data-i18n="appearance.widthNormal">标准</button>
        <button class="width-pill" data-width="1000" data-i18n="appearance.widthWide">宽</button>
        <button class="width-pill" data-width="0" data-i18n="appearance.widthFull">全宽</button>
      </div>
    </div>
    <div class="pref-row check-row">
      <label for="chk-show-toc" data-i18n="appearance.showToc">显示右侧文章大纲目录 (TOC)</label>
      <input id="chk-show-toc" type="checkbox" checked />
    </div>
    <div class="pref-row check-row">
      <label for="chk-simplify-original" data-i18n="appearance.simplifyOriginal">原版模式精简 Wikidot 顶栏与侧边栏</label>
      <input id="chk-simplify-original" type="checkbox" checked />
    </div>
  </div>

  <!-- Popover: Bookmark Edit -->
  <div id="popover-bookmark" class="popover popover-wide hidden">
    <div class="popover-title" data-i18n="bookmarkModal.title">编辑收藏</div>
    <div class="form-field">
      <label data-i18n="bookmarkModal.folder">收藏分组</label>
      <input id="bm-folder-input" class="text-input" type="text" list="bm-folder-datalist" />
      <datalist id="bm-folder-datalist"></datalist>
    </div>
    <div class="form-field">
      <label data-i18n="bookmarkModal.note">阅读备注</label>
      <textarea id="bm-note-input" class="text-input" rows="2" data-i18n-placeholder="bookmarkModal.notePlaceholder"></textarea>
    </div>
    <div class="popover-actions">
      <button id="btn-bm-remove" class="mini-btn danger-text" data-i18n="bookmarkModal.remove">移除收藏</button>
      <button id="btn-bm-save" class="accent-btn" data-i18n="bookmarkModal.save">保存</button>
    </div>
  </div>

  <!-- Modal: Settings -->
  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 data-i18n="settings.title">客户端设置</h2>
        <button id="btn-close-settings" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <section class="settings-section">
          <h3 data-i18n="settings.sectionLanguage">界面语言</h3>
          <p class="settings-hint" data-i18n="settings.languageHint"></p>
          <div class="form-field">
            <label data-i18n="settings.languageLabel">客户端显示语言</label>
            <select id="set-ui-locale" class="select-input"></select>
          </div>
        </section>

        <section class="settings-section">
          <h3 data-i18n="settings.sectionProxy">网络代理设置</h3>
          <p class="settings-hint" data-i18n="settings.proxyHint"></p>
          <div class="form-field">
            <label data-i18n="settings.proxyMode">代理模式</label>
            <select id="set-proxy-mode" class="select-input">
              <option value="system" data-i18n="settings.proxySystem">跟随系统代理（推荐）</option>
              <option value="direct" data-i18n="settings.proxyDirect">直连（不使用代理）</option>
              <option value="custom" data-i18n="settings.proxyCustom">自定义代理服务器 (HTTP / SOCKS5)</option>
            </select>
          </div>
          <div id="custom-proxy-fields" class="form-grid-2">
            <div class="form-field">
              <label data-i18n="settings.proxyRules">代理地址</label>
              <input id="set-proxy-rules" class="text-input" type="text" data-i18n-placeholder="settings.proxyRulesPlaceholder" />
            </div>
            <div class="form-field">
              <label data-i18n="settings.proxyBypass">绕过列表</label>
              <input id="set-proxy-bypass" class="text-input" type="text" placeholder="<local>" />
            </div>
          </div>
        </section>

        <section class="settings-section">
          <h3 data-i18n="settings.sectionMirrors">站点与镜像源</h3>
          <div class="form-field">
            <label data-i18n="settings.cnUrl">SCP 中文分部地址</label>
            <input id="set-cn-url" class="text-input" type="text" placeholder="https://scp-wiki-cn.wikidot.com" />
          </div>
          <div class="form-field">
            <label data-i18n="settings.enUrl">SCP 英文主站地址</label>
            <input id="set-en-url" class="text-input" type="text" placeholder="https://scp-wiki.wikidot.com" />
          </div>
          <div class="form-field">
            <label data-i18n="settings.cromUrl">Crom 搜索/随机 GraphQL API</label>
            <input id="set-crom-url" class="text-input" type="text" placeholder="https://api.crom.avn.sh/graphql" />
          </div>
          <div class="test-conn-bar">
            <button id="btn-test-network" class="secondary-btn" data-i18n="settings.testConn">测试连通性与延迟</button>
            <button id="btn-reset-mirrors" class="mini-btn" data-i18n="settings.resetMirrors">恢复默认地址</button>
          </div>
          <div id="network-test-results" class="conn-results"></div>
        </section>

        <section class="settings-section">
          <h3 data-i18n="settings.sectionReading">离线缓存与阅读习惯</h3>
          <div class="pref-row check-row">
            <label for="set-auto-cache" data-i18n="settings.autoCache">阅读文章时自动缓存到本地离线库</label>
            <input id="set-auto-cache" type="checkbox" />
          </div>
          <div class="pref-row check-row">
            <label for="set-cache-images" data-i18n="settings.cacheImages">离线缓存时同步下载文章内图片</label>
            <input id="set-cache-images" type="checkbox" />
          </div>
          <div class="pref-row check-row">
            <label for="set-restore-progress" data-i18n="settings.restoreProgress">重新打开已读文档时自动恢复上次阅读进度</label>
            <input id="set-restore-progress" type="checkbox" />
          </div>
          <div class="form-field" style="margin-top: 10px;">
            <label data-i18n="settings.defaultMode">默认阅读模式</label>
            <select id="set-reading-mode" class="select-input">
              <option value="clean" data-i18n="settings.defaultModeClean">纯净阅读模式</option>
              <option value="original" data-i18n="settings.defaultModeOriginal">原版网页模式</option>
            </select>
          </div>
        </section>

        <section class="settings-section">
          <h3 data-i18n="settings.sectionLicense">关于、开源与 SCP 协议声明</h3>
          <p class="settings-hint" data-i18n="settings.licenseBody"></p>
          <div class="test-conn-bar" style="flex-wrap:wrap;">
            <button id="btn-open-project-site" class="mini-btn" data-i18n="settings.licenseOpenSite">项目官网</button>
            <button id="btn-open-github-repo" class="mini-btn" data-i18n="settings.licenseOpenGithub">GitHub 开源仓库</button>
            <button id="btn-open-scp-guide" class="mini-btn" data-i18n="settings.licenseOpenGuide">查看 SCP 授权指南</button>
            <button id="btn-open-cc-license" class="mini-btn" data-i18n="settings.licenseOpenCC">CC BY-SA 3.0 协议</button>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <button id="btn-cancel-settings" class="secondary-btn" data-i18n="settings.cancel">取消</button>
        <button id="btn-save-settings" class="accent-btn" data-i18n="settings.save">保存并应用</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
